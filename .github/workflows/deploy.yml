name: Deploy NestJS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.name }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out deployment files
        uses: actions/checkout@v4

      - name: Copy Docker Compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/${{ secrets.EC2_USER }}/nest-app"

      - name: Copy Nginx configuration
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "nginx/default.conf"
          target: "/home/${{ secrets.EC2_USER }}/nest-app"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_NAME,IMAGE_TAG,GHCR_USERNAME,GHCR_TOKEN,EC2_USER

          script: |
            set -e

            if [ -z "${EC2_USER:-}" ]; then
              echo "EC2_USER secret is missing or empty."
              exit 1
            fi

            echo "Logging in to GitHub Container Registry..."

            echo "$GHCR_TOKEN" | docker login ghcr.io \
              --username "$GHCR_USERNAME" \
              --password-stdin

            echo "Preparing deploy directory..."

            export DEPLOY_DIR="$HOME/nest-app"
            mkdir -p "$DEPLOY_DIR/nginx"
            cd "$DEPLOY_DIR"

            echo "Pulling Docker image..."

            export NEST_IMAGE="$IMAGE_NAME:$IMAGE_TAG"
            docker compose pull

            echo "Removing old direct container if present..."
            docker compose down --remove-orphans || true

            docker rm -f nest-app || true

            echo "Starting NestJS and Nginx..."

            docker compose up -d --no-build

            echo "Logging out from GHCR..."

            docker logout ghcr.io

            echo "Cleaning unused images..."

            docker image prune -f

            echo "Container status..."

            docker compose ps

            echo "Application logs..."

            docker compose logs --tail 20 nest-app nginx

        env:
          IMAGE_NAME: ${{ needs.build.outputs.image }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          EC2_USER: ${{ secrets.EC2_USER }}