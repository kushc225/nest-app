name: Deploy NestJS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GITHUB_REPOSITORY
          script: |
            set -e

            if [ -d "$HOME/nest-app/.git" ]; then
              cd "$HOME/nest-app"
              git fetch origin main
              git reset --hard origin/main
            else
              git clone --branch main "https://github.com/${GITHUB_REPOSITORY}.git" "$HOME/nest-app"
              cd "$HOME/nest-app"
            fi

            # Build first so a failed build does not stop the current container.
            docker build --pull -t nest-app:latest .

            docker rm -f nest-app || true
            docker run -d \
              --name nest-app \
              --restart unless-stopped \
              -p 3000:3000 \
              nest-app:latest

            docker image prune -f
            docker ps --filter name=nest-app
            docker logs --tail 20 nest-app
